spring.application.name=sunrise-school-management
server.port=8080
# Default is H2 so the starter runs locally without installing MySQL.
spring.datasource.url=jdbc:h2:file:./data/sunrise-school;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# To use MySQL, replace datasource settings with your own database credentials.
# spring.datasource.url=jdbc:mysql://localhost:3306/sunrise_school
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
